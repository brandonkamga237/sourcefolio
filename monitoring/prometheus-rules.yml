groups:
  - name: sourcefolio-availability
    interval: 15s
    rules:
      - alert: BackendDown
        expr: up{job="sourcefolio-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend unreachable"
          description: "Prometheus has not scraped the API for more than a minute."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL unreachable"
          description: "The exporter no longer answers: the database is probably down."

      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox-public"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Public endpoint unreachable"
          description: "{{ $labels.instance }} has not answered 2xx from outside for 2 minutes."

  - name: sourcefolio-jobs
    interval: 30s
    rules:
      # JobRunr exposes its job counts through Micrometer once its metrics are enabled;
      # check the exact metric name on /actuator/prometheus the first time.
      - alert: BackgroundJobsFailing
        expr: increase(jobrunr_jobs_by_state{state="FAILED"}[1h]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Background jobs failing"
          description: "More than 5 jobs failed in the last hour (checks, screenshots or GitHub sync)."

      - alert: JobBacklogGrowing
        expr: jobrunr_jobs_by_state{state="ENQUEUED"} > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Job backlog growing"
          description: "More than 500 jobs have been waiting for 15 minutes: workers cannot keep up."

  # Disk, memory, CPU and container restarts of the shared VPS are alerted by lescracks' stack.
  - name: sourcefolio-capacity
    interval: 15s
    rules:
      - alert: ConnectionPoolSaturated
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL pool saturated"
          description: "Threads are waiting for a connection: the database is a bottleneck."

  - name: sourcefolio-api
    interval: 15s
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx rate"
          description: "More than 5 % of backend requests return a 5xx error."

      - alert: UnauthorizedSpike
        expr: sum(rate(http_server_requests_seconds_count{status=~"401|403"}[5m])) > 0.2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Spike of refused requests"
          description: "Many 401/403 responses: a scan or a sign-in problem."

      - alert: SlowResponses
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow responses"
          description: "The 95th percentile response time is above 1 second: the LCP budget is at risk."

      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "JVM heap high"
          description: "The backend uses more than 85 % of its heap."
