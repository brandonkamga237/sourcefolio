global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Actuator is bound to the internal management port — public traffic never sees it.
  - job_name: 'sourcefolio-backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # No node or cadvisor job: the VPS is shared with lescracks, whose stack already measures the
  # machine and its containers.

  # External probes: what a visitor actually gets, through DNS, Traefik and TLS.
  # Prometheus does not read environment variables here: the domain is written out.
  - job_name: 'blackbox-public'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://sourcefolio.lescracks.com/fr
          - https://sourcefolio.lescracks.com/en
          - https://sourcefolio.lescracks.com/sitemap.xml
          - https://sourcefolio.lescracks.com/api/catalog?size=1
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
