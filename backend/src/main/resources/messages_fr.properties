# The typographic apostrophe (’), never ': messages with arguments go through MessageFormat,
# where a straight quote starts an escape.
error.not-found=Rien n’a été trouvé à cette adresse.
error.bad-request=Cette demande ne peut pas être traitée.
error.validation=Certains champs ne sont pas valides.
error.malformed-request=La demande est mal formée.
error.conflict=Cette action entre en conflit avec l’état actuel. Actualise et réessaie.
error.forbidden=Tu n’as pas le droit de faire ça.
error.unauthenticated=Connecte-toi avec GitHub pour continuer.
error.method-not-allowed=Cette méthode n’est pas autorisée ici.
error.internal=Un problème est survenu de notre côté. Réessaie dans un instant.
