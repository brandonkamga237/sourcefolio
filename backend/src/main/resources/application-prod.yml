# Nothing here has a default: production refuses to start rather than run on a dev value.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

app:
  site:
    url: ${SITE_URL}
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    api-token: ${GITHUB_API_TOKEN}
  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    public-url: ${S3_PUBLIC_URL}

# The API description feeds the frontend's types at build time; production does not serve it.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  compression:
    enabled: true
  servlet:
    session:
      cookie:
        secure: true
  # Traefik terminates TLS, so Spring reads X-Forwarded-* to build https:// URLs.
  forward-headers-strategy: native

logging:
  level:
    com.brandonkamga.sourcefolio: INFO
    org.springframework: WARN
  file:
    name: /var/log/sourcefolio/app.log

management:
  server:
    # Actuator on an internal port Traefik never routes: metrics stay inside the Docker network.
    port: ${MANAGEMENT_PORT:9090}
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: sourcefolio-backend
