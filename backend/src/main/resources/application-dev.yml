# Only what differs from application.yaml: every value there already has a dev default.
logging:
  level:
    com.brandonkamga.sourcefolio: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# The dashboard shows queued, running and failed jobs: http://localhost:8000
jobrunr:
  dashboard:
    enabled: true
    port: 8000

# Next.js rewrites /oauth2 and /login/oauth2 to this process: the GitHub callback URL must be
# built from the browser's address (localhost:3000), which arrives in X-Forwarded-Host.
server:
  forward-headers-strategy: framework
